name: Intelligence API CI

# Validates current main intelligence runtime

on:
  push:
    paths:
      - "services/intelligence-api/**"
      - ".github/workflows/intelligence-api-ci.yml"
  pull_request:
    paths:
      - "services/intelligence-api/**"
      - ".github/workflows/intelligence-api-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: services/intelligence-api
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests
        working-directory: services/intelligence-api
        run: pytest -q